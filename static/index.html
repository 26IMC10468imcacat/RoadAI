<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoadAI</title>
<meta name="description" content="Straßenzustand auswerten, bewerten und weiterleiten">
<meta name="theme-color" content="#1d2226">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RoadAI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="kopf">
  <button class="zurueck" id="zurueck" type="button" aria-label="Zurück zur Auswahl" hidden>←</button>
  <div class="marke"><img src="/static/icon-192.png" alt="" width="28" height="28"><span>RoadAI</span></div>
  <div class="status" id="status" aria-live="polite"></div>
</header>

<main id="inhalt" tabindex="-1"></main>

<nav class="tabs" id="tabs" hidden aria-label="Bereiche">
  <button type="button" data-ansicht="strecke"><span aria-hidden="true">▤</span>Strecke</button>
  <button type="button" data-ansicht="ergebnis"><span aria-hidden="true">◆</span>Bewertung</button>
  <button type="button" data-ansicht="chat"><span aria-hidden="true">✦</span>Assistent</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="datei" accept="application/json,.json" hidden>
<noscript><p style="padding:16px">RoadAI braucht JavaScript.</p></noscript>
<script src="/static/app.js"></script>
</body>
</html>
