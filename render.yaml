services:
  - type: web
    name: roadai
    runtime: python
    region: frankfurt
    plan: free
    # Render hostet nur die Web-Oberfläche und die Beispielstrecken.
    # Fotoauswertung, Claude und Zapier laufen direkt auf dem lokalen Auswerte-Laptop.
    # Auf Render werden dafür KEINE persönlichen Schlüssel/Token benötigt.
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status
    envVars:
      - key: ROADSENSE_ROLE
        value: web
      - key: PYTHON_VERSION
        value: 3.12.7
